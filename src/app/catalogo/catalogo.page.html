<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>RentRoom - Catálogo</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment value="catalogo">
      <ion-segment-button value="home" routerLink="/home">
        <ion-icon name="home-outline"></ion-icon>
        <ion-label>Inicio</ion-label>
      </ion-segment-button>
      <ion-segment-button value="catalogo" routerLink="/catalogo">
        <ion-icon name="grid-outline"></ion-icon>
        <ion-label>Catálogo</ion-label>
      </ion-segment-button>
      <ion-segment-button value="usuario" routerLink="/usuario">
        <ion-icon name="person-outline"></ion-icon>
        <ion-label>Usuario</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Catálogo</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <h2>Catálogo</h2>
    <p>Aquí se mostrarán los elementos del catálogo.</p>
  </div>
</ion-content>
